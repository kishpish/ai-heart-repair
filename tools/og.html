<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share image template</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: var(--film); color: var(--on-film); display: grid; grid-template-columns: 700px 1fr; align-items: center; padding: 0 0 0 72px; }
  h1 { font-size: 110px; font-stretch: 62%; font-weight: 760; line-height: 0.88; letter-spacing: -0.012em; }
  .sub { margin-top: 30px; max-width: 580px; color: var(--on-film-2); font-family: var(--f-display); font-stretch: 84%; font-weight: 500; font-size: 27px; line-height: 1.22; }
  .by { margin-top: 30px; font-size: 26px; }
  canvas { width: 470px; height: 588px; margin-left: -10px; }
  .rule { position: absolute; left: 72px; right: 72px; top: 54px; border-top: 2px solid var(--on-film); }
  .mark { position: absolute; left: 72px; bottom: 44px; font-family: var(--f-mono); font-size: 17px; color: var(--on-film-3); }
</style>
</head>
<body>
  <!-- Template for assets/meta/og.png. Rendered by tools/make_meta.mjs. -->
  <div class="rule"></div>
  <div>
    <h1>A second beat for the broken heart</h1>
    <p class="sub">AI-designed hydrogels for hearts damaged by a heart attack, from one MRI to one patient-specific design</p>
    <p class="by">Krishiv Potluri</p>
  </div>
  <canvas id="v"></canvas>
  <p class="mark">kishpish.github.io/ai-heart-repair</p>
  <script type="module">
    import { createHeart } from "../js/heart3d.js";
    const heart = await createHeart(document.getElementById("v"), { src: "../assets/heart/heart.bin" });
    heart.snapshot({ yaw: -0.24, pitch: 0.12, act: 0, time: 6.4 });
    document.body.dataset.ready = "1";
  </script>
</body>
</html>
